<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務計時器</title>
<style>
  :root{
    --bg-0:#16265c;
    --bg-1:#050a24;
    --accent:#ff6a3d;
    --accent-dim:#7a3420;
    --btn-primary:#F4E9C9;
    --btn-primary-hover:#FFF7E2;
    --btn-primary-text:#16204a;
    --icon-glow:rgba(255,110,70,0.95);
    --text-hi:#eef2f8;
    --text-lo:#8b96c0;
    --gray-btn:#1a2350;
    --gray-btn-border:#33417f;
    --gray-btn-text:#a6b0d8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg-0);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:var(--bg-0);
  }

  /* ---- planet switcher ---- */
  .planet-switcher{
    position:fixed;
    top:4vh;
    right:5vw;
    display:flex;
    gap:8px;
    z-index:6;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:60vw;
  }
  .planet-btn{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;
    letter-spacing:0.04em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid var(--gray-btn-border);
    background:rgba(26,32,48,0.7);
    color:var(--gray-btn-text);
    transition:all 0.15s ease;
  }
  .planet-btn:hover{
    color:var(--text-hi);
    border-color:#3a4560;
  }
  .planet-btn.active{
    background:var(--btn-primary);
    color:var(--btn-primary-text);
    border-color:transparent;
    font-weight:600;
  }
  .planet-btn:focus-visible,
  button:focus-visible{
    outline:2px solid #3fa9ff;
    outline-offset:2px;
  }

  .hud{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:14vh;
    pointer-events:none;
  }
  .label{
    letter-spacing:0.4em;
    font-size:12px;
    color:var(--text-lo);
    text-transform:uppercase;
    margin-bottom:14px;
    font-family:'SF Mono',Menlo,Consolas,monospace;
  }
  .timer{
    font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
    font-weight:600;
    font-size:min(19vw,150px);
    line-height:1;
    letter-spacing:0.03em;
    color:var(--text-hi);
    text-shadow:0 0 40px rgba(255,255,255,0.10), 0 0 90px rgba(255,220,150,0.14);
    font-variant-numeric:tabular-nums;
    user-select:none;
  }
  .timer.warn{ color:#ffb37a; }
  .timer.critical{ color:var(--accent); }

  .sun-times{
    margin-top:16px;
    font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--text-lo);
    min-height:1em;
  }

  .progress-wrap{
    position:relative;
    width:min(70vw,560px);
    margin-top:40px;
    pointer-events:none;
  }
  .progress-track{
    position:relative;
    width:100%;
    height:5px;
    background:rgba(255,255,255,0.12);
    border-radius:999px;
    overflow:visible;
  }
  .progress-fill{
    position:absolute;
    left:0;top:0;
    height:100%;
    width:0%;
    background:linear-gradient(90deg,rgba(255,106,61,0.15),var(--accent));
    border-radius:999px;
  }
  .rocket{
    position:absolute;
    top:50%;
    left:0%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%) rotate(90deg);
    filter:drop-shadow(0 0 8px var(--icon-glow));
    transition:left 0.3s linear;
  }
  .rocket svg{
    display:block;
    width:100%;
    height:100%;
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--text-lo);
  }

  .controls{
    position:fixed;
    left:50%;
    bottom:8vh;
    transform:translateX(-50%);
    display:flex;
    gap:16px;
    z-index:5;
  }
  .launch-wrap{
    position:relative;
  }
  .jumper-pos{
    position:fixed;
    left:0;
    top:0;
    transform:translate(-50%,-100%);
    pointer-events:none;
    transition:left 1.3s cubic-bezier(.4,0,.2,1), top 1.3s cubic-bezier(.4,0,.2,1);
    z-index:20;
  }
  .jumper{
    display:inline-block;
    width:26px;
    height:26px;
    filter:drop-shadow(0 0 7px var(--icon-glow)) drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  .jumper-pos.jumping .jumper{
    animation:jumpCycle 3s ease-in-out infinite;
  }
  .jumper svg{
    display:block;
    width:100%;
    height:100%;
  }
  @keyframes jumpCycle{
    0%, 76%   { transform:translateY(0) scaleY(1); }
    84%       { transform:translateY(-18px) scaleY(1.05); }
    90%       { transform:translateY(0) scaleY(0.85); }
    94%       { transform:translateY(-6px) scaleY(1); }
    100%      { transform:translateY(0) scaleY(1); }
  }

  button{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;
    letter-spacing:0.08em;
    padding:11px 32px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid var(--gray-btn-border);
    background:var(--gray-btn);
    color:var(--gray-btn-text);
    transition:all 0.15s ease;
  }
  button:hover{
    background:#212a3d;
    color:var(--text-hi);
  }
  button:active{
    transform:scale(0.97);
  }
  button.primary{
    background:var(--btn-primary);
    border-color:var(--btn-primary);
    color:var(--btn-primary-text);
    font-weight:700;
    box-shadow:0 0 0 6px rgba(244,233,201,0.16), 0 0 28px 4px rgba(244,233,201,0.55);
  }
  button.primary:hover{
    background:var(--btn-primary-hover);
    border-color:var(--btn-primary-hover);
  }
  button:disabled{
    opacity:0.35;
    cursor:not-allowed;
    transform:none;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="planet-switcher" id="planetSwitcher">
  <button class="planet-btn" data-planet="earth">地球</button>
  <button class="planet-btn" data-planet="mars">火星</button>
  <button class="planet-btn active" data-planet="moon">月球</button>
  <button class="planet-btn" data-planet="jupiter">木星</button>
  <button class="planet-btn" data-planet="saturn">土星</button>
</div>

<div class="hud">
  <div class="label" id="statusLabel">待命中</div>
  <div class="timer" id="timer">25:00</div>
  <div class="sun-times" id="sunTimes"></div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
      <div class="rocket" id="rocket">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rocketBodyGrad" x1="12" y1="1" x2="12" y2="19" gradientUnits="userSpaceOnUse">
              <stop offset="0" style="stop-color:#fff2ea"/>
              <stop offset="1" style="stop-color:#ff7a48"/>
            </linearGradient>
            <linearGradient id="rocketFinGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color:#ffb18a"/>
              <stop offset="1" style="stop-color:#e8481f"/>
            </linearGradient>
          </defs>
          <path d="M12 1c2.7 2.7 4.1 6.1 4.1 10.1 0 2.4-.5 4.6-1.4 6.6H9.3c-.9-2-1.4-4.2-1.4-6.6C7.9 7.1 9.3 3.7 12 1z" fill="url(#rocketBodyGrad)"/>
          <circle cx="12" cy="9.6" r="1.7" fill="#0a0e18" opacity="0.75"/>
          <path d="M7.9 13.6l-3.1 3.5 3.7-1.1v-2.4z" fill="url(#rocketFinGrad)"/>
          <path d="M16.1 13.6l3.1 3.5-3.7-1.1v-2.4z" fill="url(#rocketFinGrad)"/>
          <path d="M9.7 18.2h4.6l-1.5 3.9a0.9 0.9 0 01-1.6 0l-1.5-3.9z" fill="#ffb37a"/>
        </svg>
      </div>
    </div>
    <div class="progress-labels">
      <span>啟程</span>
      <span>抵達</span>
    </div>
  </div>
</div>

<div class="jumper-pos" id="jumperPos">
  <span class="jumper">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="astroHeadGrad" x1="8" y1="2" x2="16" y2="8" gradientUnits="userSpaceOnUse">
          <stop offset="0" style="stop-color:#fff2ea"/>
          <stop offset="1" style="stop-color:#ff7a48"/>
        </linearGradient>
        <linearGradient id="astroBodyGrad" x1="2" y1="6" x2="21" y2="22" gradientUnits="userSpaceOnUse">
          <stop offset="0" style="stop-color:#ffb18a"/>
          <stop offset="1" style="stop-color:#e8481f"/>
        </linearGradient>
      </defs>
      <!-- one leg lifted, arms spread wide as if about to launch into flight -->
      <circle cx="12" cy="4.8" r="2.9" fill="url(#astroHeadGrad)"/>
      <circle cx="12" cy="4.8" r="1.6" fill="#16204a" opacity="0.55"/>
      <path d="M11.1 8.3C8.3 7.2 5.2 6.2 2.8 5.6" stroke="url(#astroBodyGrad)" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <path d="M12.9 8.3C15.7 7.0 18.8 6.6 21.3 7.9" stroke="url(#astroBodyGrad)" stroke-width="1.9" stroke-linecap="round" fill="none"/>
      <path d="M12 7.6C11.8 9.2 11.6 10.6 11.5 12.1 11.1 15.3 10.6 18.6 10.1 21.7" stroke="url(#astroBodyGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M11.9 12.4C14 12.9 15.8 13.2 16.6 15.3 17 16.4 16.6 17.7 15.5 18.3" stroke="url(#astroBodyGrad)" stroke-width="2.1" stroke-linecap="round" fill="none"/>
      <circle cx="2.8" cy="5.6" r="1.15" fill="url(#astroBodyGrad)"/>
      <circle cx="21.3" cy="7.9" r="1.15" fill="url(#astroBodyGrad)"/>
    </svg>
  </span>
</div>

<div class="controls">
  <div class="launch-wrap">
    <button id="btnLaunch" class="primary">發射</button>
  </div>
  <button id="btnStandby">待機</button>
  <button id="btnReturn">返航</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Timer ---------------- */
  var TOTAL_SECONDS = 25 * 60;
  var remaining = TOTAL_SECONDS;
  var state = "idle"; // idle | running | standby
  var tickHandle = null;

  var timerEl = document.getElementById('timer');
  var statusEl = document.getElementById('statusLabel');
  var fillEl = document.getElementById('progressFill');
  var rocketEl = document.getElementById('rocket');
  var btnLaunch = document.getElementById('btnLaunch');
  var btnStandby = document.getElementById('btnStandby');
  var btnReturn = document.getElementById('btnReturn');
  var jumperPos = document.getElementById('jumperPos');
  var arrivalLabel = document.querySelectorAll('.progress-labels span')[1];
  var criticalPhase = false;
  var criticalStartTime = 0; // rAF time when criticalPhase last turned on, so the planet bounce can match phase
  var lastFrameTime = 0;

  function positionJumper(targetEl){
    var r = targetEl.getBoundingClientRect();
    jumperPos.style.left = (r.left + r.width / 2) + 'px';
    jumperPos.style.top = (r.top - 14) + 'px';
  }

  function syncMissionVisuals(){
    if(state === 'idle'){
      jumperPos.classList.remove('at-arrival');
      positionJumper(btnLaunch);
      jumperPos.classList.add('jumping');
      criticalPhase = false;
    } else {
      jumperPos.classList.add('at-arrival');
      positionJumper(arrivalLabel);
      var nowCritical = remaining <= 300;
      if(nowCritical && !criticalPhase){
        criticalStartTime = lastFrameTime;
      }
      criticalPhase = nowCritical;
      jumperPos.classList.toggle('jumping', criticalPhase);
    }
  }

  window.addEventListener('resize', function(){
    positionJumper(jumperPos.classList.contains('at-arrival') ? arrivalLabel : btnLaunch);
  });

  function formatTime(s){
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? "0" + m : m) + ":" + (sec < 10 ? "0" + sec : sec);
  }

  function render(){
    timerEl.textContent = formatTime(remaining);
    timerEl.classList.remove('warn','critical');
    if(remaining <= 60){
      timerEl.classList.add('critical');
    } else if(remaining <= 300){
      timerEl.classList.add('warn');
    }
    var progress = 1 - (remaining / TOTAL_SECONDS);
    var pct = Math.max(0, Math.min(1, progress)) * 100;
    fillEl.style.width = pct + "%";
    rocketEl.style.left = pct + "%";
  }

  function tick(){
    if(remaining > 0){
      remaining--;
      render();
      if(remaining === 0){
        stopTicking();
        state = "idle";
        statusEl.textContent = "任務完成";
        updateButtons();
      }
      syncMissionVisuals();
    }
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(tick, 1000);
  }

  function stopTicking(){
    if(tickHandle){
      clearInterval(tickHandle);
      tickHandle = null;
    }
  }

  function updateButtons(){
    btnLaunch.disabled = (state === "running");
    btnStandby.disabled = (state !== "running");
    btnReturn.disabled = (state === "idle" && remaining === TOTAL_SECONDS);
  }

  btnLaunch.addEventListener('click', function(){
    if(state === "running") return;
    state = "running";
    statusEl.textContent = "任務進行中";
    startTicking();
    updateButtons();
    syncMissionVisuals();
  });

  btnStandby.addEventListener('click', function(){
    if(state !== "running") return;
    state = "standby";
    stopTicking();
    statusEl.textContent = "待機中";
    updateButtons();
    syncMissionVisuals();
  });

  btnReturn.addEventListener('click', function(){
    stopTicking();
    state = "idle";
    remaining = TOTAL_SECONDS;
    statusEl.textContent = "待命中";
    render();
    updateButtons();
    syncMissionVisuals();
  });

  render();
  updateButtons();
  syncMissionVisuals();

  /* ---------------- Sunrise / sunset (Taipei) ---------------- */
  var sunTimesEl = document.getElementById('sunTimes');
  var SUN_API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56&daily=sunrise,sunset&timezone=Asia/Taipei&forecast_days=1';

  function formatHM(iso){
    var t = iso && iso.split('T')[1];
    return t ? t.slice(0, 5) : null;
  }

  function loadSunTimes(){
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 8000);

    fetch(SUN_API_URL, { signal: controller.signal })
      .then(function(res){
        if(!res.ok) throw new Error('bad response');
        return res.json();
      })
      .then(function(data){
        var sunrise = formatHM(data.daily && data.daily.sunrise && data.daily.sunrise[0]);
        var sunset = formatHM(data.daily && data.daily.sunset && data.daily.sunset[0]);
        if(!sunrise || !sunset) throw new Error('bad payload');
        sunTimesEl.textContent = '日出 ' + sunrise + ' ／ 日落 ' + sunset;
      })
      .catch(function(){
        sunTimesEl.textContent = '離線';
      })
      .finally(function(){
        clearTimeout(timeoutId);
      });
  }

  loadSunTimes();

  /* ---------------- Planet Scene ---------------- */
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var W = 0, H = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    buildPlanetGeom();
    buildPlanetBlotches();
    buildRings();
    buildRadialParticles();
  }

  /* ---- deterministic PRNG so stars/rings never jump on redraw/resize ---- */
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Stars are generated once in normalized [0,1] space against a fixed
     seed, then mapped to the current W/H on every resize/draw. This keeps
     their relative layout fixed regardless of viewport size. */
  var STAR_COUNT = 260;
  var starsNorm = null; // {x,y,r,baseAlpha,tw} in [0,1] space, fixed forever

  function buildStars(){
    if(starsNorm) return; // build exactly once
    var rand = mulberry32(1337);
    starsNorm = [];
    for(var i = 0; i < STAR_COUNT; i++){
      starsNorm.push({
        x: rand(),
        y: rand(),
        r: 0.4 + rand() * 1.3,
        baseAlpha: 0.25 + rand() * 0.6,
        tw: rand() * Math.PI * 2,
        speed: 0.4 + rand() * 0.8
      });
    }
  }

  /* ---- Saturn's rings: a fixed diagonal dust band across the sky ---- */
  var ringPointsNorm = null;
  var RING_COUNT = 300;

  function buildRings(){
    if(ringPointsNorm) return; // build exactly once
    var rand = mulberry32(24601);
    ringPointsNorm = [];
    for(var i = 0; i < RING_COUNT; i++){
      ringPointsNorm.push({
        t: rand(),               // position along the band, 0..1 (left..right)
        thickness: rand() - 0.5, // -0.5..0.5 across the band
        size: 0.5 + rand() * 1.6,
        alpha: 0.25 + rand() * 0.65
      });
    }
  }

  function drawRings(theme){
    if(!theme.rings || !ringPointsNorm) return;
    var y0n = 0.24, y1n = 0.05; // normalized sky height, left -> right
    var bandWidthN = 0.045;
    var c = theme.dayColor;
    for(var i = 0; i < ringPointsNorm.length; i++){
      var p = ringPointsNorm[i];
      var x = p.t * W;
      var baseYn = y0n + (y1n - y0n) * p.t;
      var arc = Math.sin(p.t * Math.PI) * 0.02;
      var y = (baseYn - arc + p.thickness * bandWidthN) * H;
      var edgeFade = 1 - Math.min(1, Math.abs(p.thickness) * 1.6);
      var alpha = p.alpha * edgeFade;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha.toFixed(3) + ')';
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---- Planet: painted disc with gradient shading + weathered texture ---- */
  var PLANET_RADIUS_RATIO = 1.35; // relative to width, planet center below screen
  var planetGeom = null;
  var planetBlotches = null;
  var BLOTCH_COUNT = 46;

  // Light bias (upper-left), expressed as a fraction of the planet radius
  var LIGHT_OFFSET = { x: -0.42, y: -0.55 };

  function buildPlanetGeom(){
    var radius = W * PLANET_RADIUS_RATIO * 0.62;
    var cx = W * 0.5;
    var cy = H + radius * 0.62; // push planet mostly below the frame
    planetGeom = { cx: cx, cy: cy, radius: radius };
  }

  function buildPlanetBlotches(){
    if(planetBlotches) return; // build exactly once, weathering stays fixed
    var rand = mulberry32(4242);
    planetBlotches = [];
    for(var i = 0; i < BLOTCH_COUNT; i++){
      var ang = rand() * Math.PI * 2;
      var rr = Math.sqrt(rand()) * 0.92; // even area distribution within the disc
      planetBlotches.push({
        lx: Math.cos(ang) * rr,
        ly: Math.sin(ang) * rr,
        r: 0.10 + rand() * 0.22,
        tone: (rand() - 0.5) * 2, // -1 (darker patch) .. 1 (lighter patch)
        alpha: 0.10 + rand() * 0.16,
        jitter: rand()
      });
    }
  }

  /* ---- Per-planet visual themes ---- */
  var PLANET_THEMES = {
    earth: {
      bg: ['#03050a', '#070b16'],
      glow: ['rgba(110,160,255,0.16)', 'rgba(140,180,255,0.10)'],
      rim: 'rgba(180,210,255,0.10)',
      base: '#05070d',
      dayColor: { r:210, g:225, b:255 },
      nightColor: { r:14, g:19, b:32 },
      bands: null,
      rings: false
    },
    mars: {
      bg: ['#0e0502', '#1c0a04'],
      glow: ['rgba(255,120,70,0.18)', 'rgba(255,150,90,0.10)'],
      rim: 'rgba(255,180,120,0.12)',
      base: '#130703',
      dayColor: { r:255, g:130, b:80 },
      nightColor: { r:40, g:16, b:9 },
      bands: null,
      rings: false
    },
    moon: {
      bg: ['#16265c', '#050a24'],
      glow: ['rgba(255,225,150,0.22)', 'rgba(255,235,180,0.12)'],
      rim: 'rgba(255,240,205,0.16)',
      base: '#241c10',
      dayColor: { r:248, g:236, b:194 },
      nightColor: { r:34, g:28, b:18 },
      bands: null,
      rings: false
    },
    jupiter: {
      bg: ['#110c06', '#1b140a'],
      glow: ['rgba(255,210,140,0.14)', 'rgba(255,220,160,0.08)'],
      rim: 'rgba(255,230,180,0.10)',
      base: '#100b06',
      dayColor: { r:230, g:190, b:130 },
      nightColor: { r:42, g:30, b:18 },
      bands: [
        { r:238, g:206, b:160 },
        { r:196, g:145, b:96 },
        { r:222, g:178, b:118 },
        { r:172, g:114, b:76 },
        { r:230, g:195, b:150 }
      ],
      rings: false
    },
    saturn: {
      bg: ['#100c05', '#1a1409'],
      glow: ['rgba(255,225,160,0.16)', 'rgba(255,235,180,0.10)'],
      rim: 'rgba(255,240,200,0.12)',
      base: '#0f0b05',
      dayColor: { r:236, g:206, b:152 },
      nightColor: { r:46, g:34, b:19 },
      bands: null,
      rings: true
    }
  };

  var currentPlanet = 'moon';

  function mixColor(a, b, t){
    return {
      r: a.r + (b.r - a.r) * t,
      g: a.g + (b.g - a.g) * t,
      b: a.b + (b.b - a.b) * t
    };
  }

  function rgbaStr(c, a){
    return 'rgba(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ',' + a.toFixed(3) + ')';
  }

  function bandColorFor(theme, ly, jitter){
    if(!theme.bands) return theme.dayColor;
    var t = (ly + 1) / 2; // 0..1
    var idx = Math.min(theme.bands.length - 1, Math.max(0, Math.floor(t * theme.bands.length)));
    var c = theme.bands[idx];
    var noise = 0.88 + jitter * 0.24;
    return {
      r: Math.min(255, c.r * noise),
      g: Math.min(255, c.g * noise),
      b: Math.min(255, c.b * noise)
    };
  }

  // Mirrors the astronaut's CSS jumpCycle keyframes so the planet bounces
  // at the same frequency (and roughly the same phase) once critical.
  var BOUNCE_KEYFRAMES = [
    { p:0.00, y:0 },
    { p:0.76, y:0 },
    { p:0.84, y:-18 },
    { p:0.90, y:0 },
    { p:0.94, y:-6 },
    { p:1.00, y:0 }
  ];

  function jumpBounceY(time, radius){
    if(!criticalPhase) return 0;
    var cycle = 3000;
    var phase = (((time - criticalStartTime) % cycle) + cycle) % cycle / cycle;
    for(var i = 0; i < BOUNCE_KEYFRAMES.length - 1; i++){
      var a = BOUNCE_KEYFRAMES[i], b = BOUNCE_KEYFRAMES[i + 1];
      if(phase >= a.p && phase <= b.p){
        var span = (b.p - a.p) || 1;
        var localT = (phase - a.p) / span;
        var y = a.y + (b.y - a.y) * localT;
        return (y / 18) * (radius * 0.05);
      }
    }
    return 0;
  }

  function drawPlanet(time, theme){
    var g = planetGeom;
    var cx = g.cx, cy = g.cy, radius = g.radius;

    ctx.save();
    ctx.translate(0, jumpBounceY(time, radius));

    // Atmosphere glow ring along the visible horizon (top arc of the planet)
    var glowGrad = ctx.createRadialGradient(cx, cy, radius * 0.965, cx, cy, radius * 1.14);
    glowGrad.addColorStop(0, 'rgba(120,170,255,0.0)');
    glowGrad.addColorStop(0.35, theme.glow[0]);
    glowGrad.addColorStop(0.6, theme.glow[1]);
    glowGrad.addColorStop(1, 'rgba(140,180,255,0)');
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.14, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();
    ctx.restore();

    // extra rim glow biased toward light side (upper-left)
    ctx.save();
    var rimGrad = ctx.createRadialGradient(
      cx - radius * 0.5, cy - radius * 0.5, radius * 0.2,
      cx, cy, radius * 1.1
    );
    rimGrad.addColorStop(0, 'rgba(255,255,255,0)');
    rimGrad.addColorStop(0.78, 'rgba(255,255,255,0)');
    rimGrad.addColorStop(0.92, theme.rim);
    rimGrad.addColorStop(1, 'rgba(180,210,255,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.14, 0, Math.PI * 2);
    ctx.fillStyle = rimGrad;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    // directional gradient shading: bright near the light point, fading to shadow at the far edge
    var lightX = cx + LIGHT_OFFSET.x * radius;
    var lightY = cy + LIGHT_OFFSET.y * radius;
    var highlight = mixColor(theme.dayColor, { r:255, g:255, b:255 }, 0.35);
    var midTone = mixColor(theme.dayColor, theme.nightColor, 0.55);
    var shadeGrad = ctx.createRadialGradient(lightX, lightY, radius * 0.05, lightX, lightY, radius * 1.7);
    shadeGrad.addColorStop(0, rgbaStr(highlight, 1));
    shadeGrad.addColorStop(0.32, rgbaStr(theme.dayColor, 1));
    shadeGrad.addColorStop(0.68, rgbaStr(midTone, 1));
    shadeGrad.addColorStop(1, rgbaStr(theme.nightColor, 1));
    ctx.fillStyle = shadeGrad;
    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

    // weathered blotches: soft, fixed patches for an aged/brushed surface
    for(var i = 0; i < planetBlotches.length; i++){
      var bl = planetBlotches[i];
      var bx = cx + bl.lx * radius;
      var by = cy + bl.ly * radius;
      var br = bl.r * radius;
      var base = bandColorFor(theme, bl.ly, bl.jitter);
      var tintTarget = bl.tone > 0 ? { r:255, g:255, b:255 } : theme.nightColor;
      var blotchColor = mixColor(base, tintTarget, Math.abs(bl.tone) * 0.5);
      var blobGrad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      blobGrad.addColorStop(0, rgbaStr(blotchColor, bl.alpha));
      blobGrad.addColorStop(1, rgbaStr(blotchColor, 0));
      ctx.beginPath();
      ctx.fillStyle = blobGrad;
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }

    // fine grain for a brushed/aged canvas feel
    if(grainPattern){
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = grainPattern;
      ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
      ctx.restore();
    }

    // gentle limb darkening so the disc reads as a round, lit sphere
    var limbGrad = ctx.createRadialGradient(cx, cy, radius * 0.55, cx, cy, radius);
    limbGrad.addColorStop(0, 'rgba(0,0,0,0)');
    limbGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = limbGrad;
    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
    ctx.restore();

    ctx.restore(); // undo clip
    ctx.restore(); // undo bounce translate
  }

  /* ---- Radiating particles: stream outward from the planet's center ---- */
  var RADIAL_PARTICLE_COUNT = 90;
  var radialParticles = null;

  function buildRadialParticles(){
    if(radialParticles) return; // build exactly once
    var rand = mulberry32(31415);
    radialParticles = [];
    for(var i = 0; i < RADIAL_PARTICLE_COUNT; i++){
      radialParticles.push({
        angle: rand() * Math.PI * 2,
        phase: rand(),
        cycleMs: 3400 + rand() * 2200,
        size: 0.7 + rand() * 1.6,
        alphaBase: 0.25 + rand() * 0.45
      });
    }
  }

  function drawRadialParticles(time, theme){
    var g = planetGeom;
    var cx = g.cx, cy = g.cy, radius = g.radius;
    var speedMult = criticalPhase ? 2 : 1;
    var tint = mixColor(theme.dayColor, { r:255, g:255, b:255 }, 0.5);

    for(var i = 0; i < radialParticles.length; i++){
      var p = radialParticles[i];
      var t = (((time * speedMult) / p.cycleMs) + p.phase) % 1;
      var dist = t * radius * 1.35;
      var x = cx + Math.cos(p.angle) * dist;
      var y = cy + Math.sin(p.angle) * dist;
      if(x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      var alpha = p.alphaBase * Math.sin(t * Math.PI);
      if(alpha <= 0.01) continue;
      ctx.beginPath();
      ctx.fillStyle = rgbaStr(tint, alpha);
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawStars(time){
    for(var i = 0; i < starsNorm.length; i++){
      var s = starsNorm[i];
      var sx = s.x * W;
      var sy = s.y * H;

      // skip stars that would be hidden behind/inside the planet body
      var g = planetGeom;
      var dx = sx - g.cx, dy = sy - g.cy;
      if(Math.sqrt(dx*dx + dy*dy) < g.radius * 0.995) continue;

      var twinkle = 0.75 + 0.25 * Math.sin(time * 0.001 * s.speed + s.tw);
      var alpha = s.baseAlpha * twinkle;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBackground(theme){
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.bg[0]);
    grad.addColorStop(1, theme.bg[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---- subtle painterly grain overlay, built once from a fixed seed ---- */
  var grainPattern = null;

  function buildGrain(){
    if(grainPattern) return;
    var size = 128;
    var off = document.createElement('canvas');
    off.width = size; off.height = size;
    var octx = off.getContext('2d');
    var imgData = octx.createImageData(size, size);
    var rand = mulberry32(777);
    for(var i = 0; i < imgData.data.length; i += 4){
      var v = Math.floor(rand() * 255);
      imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 255;
    }
    octx.putImageData(imgData, 0, 0);
    grainPattern = ctx.createPattern(off, 'repeat');
  }

  function drawGrain(){
    if(!grainPattern) return;
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function frame(time){
    lastFrameTime = time;
    var theme = PLANET_THEMES[currentPlanet];
    ctx.clearRect(0, 0, W, H);
    drawBackground(theme);
    drawGrain();
    drawStars(time);
    drawRings(theme);
    drawPlanet(time, theme);
    drawRadialParticles(time, theme);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  buildGrain();
  resize();
  requestAnimationFrame(frame);

  /* ---------------- Planet switcher ---------------- */
  var switcher = document.getElementById('planetSwitcher');
  switcher.addEventListener('click', function(e){
    var btn = e.target.closest('.planet-btn');
    if(!btn) return;
    var planet = btn.getAttribute('data-planet');
    if(!PLANET_THEMES[planet] || planet === currentPlanet) return;
    currentPlanet = planet;
    var buttons = switcher.querySelectorAll('.planet-btn');
    for(var i = 0; i < buttons.length; i++){
      buttons[i].classList.toggle('active', buttons[i] === btn);
    }
  });

})();
</script>

</body>
</html>
